<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Z2M-Automations</title>
    <link rel="stylesheet" href="designer.css">
    <link rel="stylesheet" href="desktop-palette.css">
    <link rel="stylesheet" href="confirmation.css">
</head>
<body>
    <main aria-labelledby="question" aria-describedby="detail">
        <h1 id="question"></h1>
        <p id="detail" tabindex="0"></p>
        <div id="resume-choice" hidden>
            <label><input id="resume-previous-operation" type="checkbox" aria-describedby="resume-help"><span id="resume-label"></span></label>
            <p id="resume-help"></p>
        </div>
        <footer>
            <button id="cancel" type="button"></button>
            <button id="save" type="button" hidden></button>
            <button id="accept" type="button"></button>
        </footer>
    </main>
</body>
</html>
